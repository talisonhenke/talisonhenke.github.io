<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >

    <title>Farm Aura — Prototype</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #090b14;

            touch-action: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;

        }

        canvas {

            display: block;

            touch-action: none;

        }

    </style>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<script>

// ============================================================
// CONFIGURAÇÃO GERAL
// ============================================================

const GAME_CONFIG = {

    STARTING_AURA: 50,

    MAX_AURA: 100,

    // --------------------------------------------------------
// DRENAGEM
// --------------------------------------------------------

BASE_DRAIN_PER_SECOND: 7,

// Multiplicador de drain conforme o nível da Aura
DRAIN_BY_AURA_LEVEL: [
    1.60,
    2.00,
    2.25,
    2.50,
    3.00
],

DIFFICULTY_INTERVAL: 5000,

DRAIN_INCREASE: 0.10,

    // --------------------------------------------------------
    // RECUPERAÇÃO
    // --------------------------------------------------------

    BASE_HP_RECOVERY_PER_CLICK: 2,

    EGO_50_HP_BONUS_PER_CLICK: 2,

    EGO_75_HP_BONUS_PER_CLICK: 4,

    EGO_100_DRAIN_RECOVERY_RATIO: 0.50,

    // --------------------------------------------------------
    // SCORE
    // --------------------------------------------------------

    BASE_SCORE_PER_HIT: 10,

    SCORE_TIERS: [

        { combo: 1, points: 10 },
        { combo: 10, points: 20 },
        { combo: 25, points: 35 },
        { combo: 50, points: 60 },
        { combo: 75, points: 100 },
        { combo: 100, points: 150 },
        { combo: 150, points: 250 },
        { combo: 200, points: 350 }

    ],

    RANDOM_BONUS_MIN: 1,

    RANDOM_BONUS_MAX_BY_AURA: [
        20,
        40,
        60,
        80,
        100
    ],

    // --------------------------------------------------------
    // AURA
    // --------------------------------------------------------

    AURA_GAIN_PER_HIT: 2,

    AURA_RESET_AFTER_LEVEL_UP: 50,

    HIT_COMBO_MILESTONE: 30,

    // --------------------------------------------------------
    // EGO
    // --------------------------------------------------------

    EGO_PER_MILESTONE: 10,

    MIN_EGO_TO_ACTIVATE: 50,

    MAX_EGO: 100,

    EGO_MAX_DURATION: 15000,

    EGO_MULTIPLIER: 2,

    CHARACTER_SCALE: 1.05,

    EGO_CHARACTER_SCALE: 1.16,

    // --------------------------------------------------------
    // VISUAIS
    // --------------------------------------------------------

    AURA_BACKGROUND_SPEED: [
        18,
        32,
        50,
        72,
        100
    ],

    AURA_GLOW_RADIUS: [
        0,
        72,
        82,
        94,
        108
    ],

    AURA_GLOW_ALPHA: [
        0,
        0.16,
        0.20,
        0.25,
        0.30
    ],

    // --------------------------------------------------------
    // ÁUDIO
    // --------------------------------------------------------

    MUSIC_ENABLED_BY_DEFAULT: true

};


// ============================================================
// ARQUIVOS DE ÁUDIO
// ============================================================

const AUDIO_FILES = {

    BACKGROUND_MUSIC:
        "BGM/background_music.ogg",

    AURA_LEVEL_UP:
        "BGM/aura_level_up.ogg",

    EGO_ACTIVATE:
        "BGM/ego_activate.ogg"

};


// ============================================================
// CORES DA AURA
// ============================================================

const AURA_LEVELS = [

    {
        level: 1,
        color: 0x60a5fa,
        hex: "#60a5fa"
    },

    {
        level: 2,
        color: 0x34d399,
        hex: "#34d399"
    },

    {
        level: 3,
        color: 0xfacc15,
        hex: "#facc15"
    },

    {
        level: 4,
        color: 0xfb923c,
        hex: "#fb923c"
    },

    {
        level: 5,
        color: 0xf43f5e,
        hex: "#f43f5e"
    }

];


// ============================================================
// DETECÇÃO MOBILE
// ============================================================

const IS_MOBILE =
    window.matchMedia("(max-width: 700px)").matches ||
    "ontouchstart" in window;


// ============================================================
// AUDIO SYSTEM
// ============================================================

class AudioSystem {

    constructor() {

        this.audioContext = null;

        this.musicEnabled =
            GAME_CONFIG.MUSIC_ENABLED_BY_DEFAULT;

        this.music = null;

        this.customSounds = {};

        this.customSoundsLoaded = false;

    }


    init() {

        if (!this.audioContext) {

            this.audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        this.loadCustomSounds();

        if (
            this.audioContext.state === "suspended"
        ) {

            return this.audioContext.resume();

        }

        return Promise.resolve();

    }


    loadCustomSounds() {

        if (this.customSoundsLoaded) {
            return;
        }

        this.customSoundsLoaded = true;

        Object.keys(AUDIO_FILES).forEach(
            key => {

                if (
                    key === "BACKGROUND_MUSIC"
                ) {

                    return;

                }

                const audio =
                    new Audio(
                        AUDIO_FILES[key]
                    );

                audio.preload = "auto";

                audio.volume = 1.0;

                audio.addEventListener(
                    "error",
                    () => {

                        console.warn(
                            "[AudioSystem] Não foi possível carregar:",
                            AUDIO_FILES[key]
                        );

                    }
                );

                this.customSounds[key] =
                    audio;

            }
        );

        this.music =
            new Audio(
                AUDIO_FILES.BACKGROUND_MUSIC
            );

        this.music.preload = "auto";

        this.music.loop = true;

        this.music.volume = 0.28;

        this.music.addEventListener(
            "error",
            () => {

                console.warn(
                    "[AudioSystem] Não foi possível carregar:",
                    AUDIO_FILES.BACKGROUND_MUSIC
                );

            }
        );

    }


    playCustomSound(
        soundKey,
        volume = 1.0
    ) {

        const audio =
            this.customSounds[soundKey];

        if (!audio) {
            return;
        }

        try {

            audio.pause();

            audio.currentTime = 0;

            audio.volume =
                Phaser.Math.Clamp(
                    volume,
                    0,
                    1
                );

            const promise =
                audio.play();

            if (
                promise &&
                typeof promise.catch === "function"
            ) {

                promise.catch(
                    () => {}
                );

            }

        }

        catch (error) {

            console.warn(
                "[AudioSystem] Erro:",
                error
            );

        }

    }


    tone(
        frequency,
        time,
        duration,
        type,
        volume
    ) {

        if (!this.audioContext) {
            return;
        }

        const oscillator =
            this.audioContext.createOscillator();

        const gain =
            this.audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            time
        );

        gain.gain.setValueAtTime(
            volume,
            time
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time + duration
        );

        oscillator.connect(gain);

        gain.connect(
            this.audioContext.destination
        );

        oscillator.start(time);

        oscillator.stop(
            time + duration
        );

    }


    hit() {

        if (!this.audioContext) {
            return;
        }

        const now =
            this.audioContext.currentTime;

        this.tone(
            420,
            now,
            0.045,
            "triangle",
            0.035
        );

    }


    levelUp() {

        this.playCustomSound(
            "AURA_LEVEL_UP",
            1.0
        );

    }


    egoGain() {

        if (!this.audioContext) {
            return;
        }

        const now =
            this.audioContext.currentTime;

        this.tone(
            520,
            now,
            0.08,
            "triangle",
            0.08
        );

        this.tone(
            780,
            now + 0.06,
            0.12,
            "triangle",
            0.09
        );

    }


    egoActivate() {

        this.playCustomSound(
            "EGO_ACTIVATE",
            0.4
        );

    }


    egoEnd() {

        if (!this.audioContext) {
            return;
        }

        const now =
            this.audioContext.currentTime;

        this.tone(
            440,
            now,
            0.12,
            "triangle",
            0.05
        );

        this.tone(
            330,
            now + 0.08,
            0.18,
            "triangle",
            0.04
        );

    }


    startMusic() {

        if (!this.musicEnabled) {
            return;
        }

        if (!this.music) {
            this.loadCustomSounds();
        }

        if (!this.music) {
            return;
        }

        this.music.volume = 0.28;

        try {

            const promise =
                this.music.play();

            if (
                promise &&
                typeof promise.catch === "function"
            ) {

                promise.catch(
                    () => {}
                );

            }

        }

        catch (error) {

            console.warn(
                "[AudioSystem] Erro ao iniciar música:",
                error
            );

        }

    }


    stopMusic() {

        if (!this.music) {
            return;
        }

        this.music.pause();

        this.music.currentTime = 0;

    }


    toggleMusic() {

        this.musicEnabled =
            !this.musicEnabled;

        if (this.musicEnabled) {

            this.init().then(
                () => {

                    this.startMusic();

                }
            );

        }

        else {

            this.stopMusic();

        }

        return this.musicEnabled;

    }

}


// ============================================================
// GAME SCENE
// ============================================================

class FarmAuraScene extends Phaser.Scene {

    constructor() {

        super("FarmAuraScene");

    }


    // ========================================================
    // CREATE
    // ========================================================

    create() {

        this.gameWidth =
            this.scale.width;

        this.gameHeight =
            this.scale.height;

        this.playAreaTop =
            250;

        this.playAreaBottom =
            this.gameHeight - 95;

        if (
            this.playAreaBottom <=
            this.playAreaTop + 180
        ) {

            this.playAreaTop =
                Math.max(
                    230,
                    this.gameHeight * 0.36
                );

            this.playAreaBottom =
                this.gameHeight - 70;

        }

        this.playAreaHeight =
            this.playAreaBottom -
            this.playAreaTop;


        // ----------------------------------------------------
        // ESTADO
        // ----------------------------------------------------

        this.gameStarted = false;

        this.gameOver = false;

        this.aura =
            GAME_CONFIG.STARTING_AURA;

        this.auraLevel = 1;

        this.combo = 0;

        this.maxCombo = 0;

        this.score = 0;

        this.ego = 0;

        this.egoActive = false;

        this.egoRemainingTime = 0;

        this.activeEgoTier = 0;

        this.activeEgoCharge = 0;

        this.difficultyLevel = 0;

        this.difficultyTimer = 0;


        // ----------------------------------------------------
        // ÁUDIO
        // ----------------------------------------------------

        this.audio =
            new AudioSystem();


        // ----------------------------------------------------
        // BACKGROUND
        // ----------------------------------------------------

        this.createBackground();


        // ----------------------------------------------------
        // PERSONAGEM
        // ----------------------------------------------------

        this.createCharacter();


        // ----------------------------------------------------
        // HITBOX
        // ----------------------------------------------------

        this.createCharacterHitArea();


        // ----------------------------------------------------
        // HUD
        // ----------------------------------------------------

        this.createHUD();


        // ----------------------------------------------------
        // MÚSICA
        // ----------------------------------------------------

        this.createMusicControl();


        // ----------------------------------------------------
        // START SCREEN
        // ----------------------------------------------------

        this.createStartScreen();


        // ----------------------------------------------------
        // BOTÃO DIREITO = EGO NO PC
        // ----------------------------------------------------

        this.game.canvas.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

            }
        );


        this.game.canvas.addEventListener(
            "mousedown",
            event => {

                if (
                    event.button !== 2
                ) {

                    return;

                }

                if (
                    IS_MOBILE
                ) {

                    return;

                }

                event.preventDefault();

                this.activateEgo();

            }
        );


        // ----------------------------------------------------
        // RESIZE
        // ----------------------------------------------------

        this.scale.on(
            "resize",
            this.handleResize,
            this
        );


        this.updateAuraVisual();

        this.updateHUD(true);

    }


    // ========================================================
    // BACKGROUND
    // ========================================================

    createBackground() {

        this.background =
            this.add.rectangle(
                0,
                0,
                this.gameWidth,
                this.gameHeight,
                0x090b14
            ).setOrigin(0, 0);


        this.centerGlow =
            this.add.circle(
                this.gameWidth / 2,
                this.playAreaTop +
                this.playAreaHeight * 0.52,
                280,
                0x6366f1,
                0.035
            );


        this.tweens.add({

            targets:
                this.centerGlow,

            scale:
                1.12,

            alpha:
                0.06,

            duration:
                1800,

            yoyo:
                true,

            repeat:
                -1,

            ease:
                "Sine.easeInOut"

        });


        this.particles = [];


        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const particle =
                this.add.circle(

                    Phaser.Math.Between(
                        0,
                        this.gameWidth
                    ),

                    Phaser.Math.Between(
                        this.playAreaTop,
                        this.playAreaBottom
                    ),

                    Phaser.Math.Between(
                        1,
                        3
                    ),

                    0x818cf8,

                    Phaser.Math.FloatBetween(
                        0.15,
                        0.50
                    )

                );


            particle.baseSpeed =
                Phaser.Math.FloatBetween(
                    0.75,
                    1.35
                );


            this.particles.push(
                particle
            );

        }


        this.characterAura =
            this.add.circle(

                this.gameWidth / 2,

                this.playAreaTop +
                this.playAreaHeight * 0.55,

                0,

                0xffffff,
                0

            );


        this.characterAura.setDepth(1);

    }


    // ========================================================
    // VISUAL DA AURA
    // ========================================================

    updateAuraVisual() {

        if (!this.characterAura) {
            return;
        }


        const level =
            Phaser.Math.Clamp(
                this.auraLevel,
                1,
                5
            );


        const levelData =
            AURA_LEVELS[level - 1];


        if (level === 1) {

            this.tweens.killTweensOf(
                this.characterAura
            );


            this.characterAura
                .setRadius(0)
                .setAlpha(0);


            return;

        }


        const radius =
            GAME_CONFIG
                .AURA_GLOW_RADIUS[level - 1];


        const alpha =
            GAME_CONFIG
                .AURA_GLOW_ALPHA[level - 1];


        this.characterAura.x =
            this.character.x;


        this.characterAura.y =
            this.character.y;


        this.characterAura.setFillStyle(
            levelData.color,
            alpha
        );


        this.characterAura
            .setRadius(radius)
            .setAlpha(alpha);


        this.tweens.killTweensOf(
            this.characterAura
        );


        const pulseDuration =
            850 -
            (
                (level - 2) *
                110
            );


        this.tweens.add({

            targets:
                this.characterAura,

            scale:
                1.18,

            alpha:
                Math.min(
                    0.42,
                    alpha + 0.10
                ),

            duration:
                pulseDuration,

            yoyo:
                true,

            repeat:
                -1,

            ease:
                "Sine.easeInOut"

        });

    }


    // ========================================================
    // PERSONAGEM
    // ========================================================

    createCharacter() {

        const characterX =
            this.gameWidth / 2;


        const characterY =
            this.playAreaTop +
            this.playAreaHeight * 0.55;


        this.character =
            this.add.container(
                characterX,
                characterY
            );


        this.character.setScale(
            GAME_CONFIG.CHARACTER_SCALE
        );


        const body =
            this.add.rectangle(
                0,
                30,
                60,
                95,
                0xf97316
            );


        const head =
            this.add.circle(
                0,
                -35,
                36,
                0xf5c6a5
            );


        const eyeLeft =
            this.add.circle(
                -11,
                -40,
                4,
                0x111827
            );


        const eyeRight =
            this.add.circle(
                11,
                -40,
                4,
                0x111827
            );


        this.leftArm =
            this.add.rectangle(
                -43,
                34,
                14,
                52,
                0xf5c6a5
            );


        this.rightArm =
            this.add.rectangle(
                43,
                34,
                14,
                52,
                0xf5c6a5
            );


        const leftLeg =
            this.add.rectangle(
                -18,
                105,
                18,
                60,
                0x1f2937
            );


        const rightLeg =
            this.add.rectangle(
                18,
                105,
                18,
                60,
                0x1f2937
            );


        this.character.add([

            body,
            head,

            eyeLeft,
            eyeRight,

            this.leftArm,
            this.rightArm,

            leftLeg,
            rightLeg

        ]);


        this.setCharacterArm(
            "right"
        );

    }


    // ========================================================
    // HITBOX
    // ========================================================

    createCharacterHitArea() {

        const hitWidth =
            IS_MOBILE
                ? 190
                : 175;


        const hitHeight =
            IS_MOBILE
                ? 285
                : 265;


        this.characterHitArea =
            this.add.rectangle(

                this.character.x,

                this.character.y + 35,

                hitWidth,

                hitHeight,

                0xffffff,
                0

            );


        this.characterHitArea.setDepth(10);


        this.characterHitArea.setInteractive({

            useHandCursor:
                !IS_MOBILE

        });


        this.characterHitArea.on(

            "pointerdown",

            pointer => {

                if (
                    pointer.button !== 0
                ) {

                    return;

                }


                if (
                    pointer.event &&
                    pointer.event.preventDefault
                ) {

                    pointer.event.preventDefault();

                }


                this.handleCharacterClick();

            }

        );


        this.clickRing =
            this.add.circle(

                this.character.x,

                this.character.y + 20,

                70,

                0xffffff,
                0

            );


        this.clickRing.setStrokeStyle(
            2,
            0xffffff,
            0
        );


        this.clickRing.setDepth(9);

    }


    // ========================================================
    // CLIQUE NO PERSONAGEM
    // ========================================================

    handleCharacterClick() {

        if (
            !this.gameStarted ||
            this.gameOver
        ) {

            return;

        }


        this.audio.init();


        // ----------------------------------------------------
        // COMBO
        // ----------------------------------------------------

        this.combo++;


        this.maxCombo =
            Math.max(
                this.maxCombo,
                this.combo
            );


        // ----------------------------------------------------
        // SCORE
        // ----------------------------------------------------

        let points =
            this.calculateScore();


        if (
            this.egoActive
        ) {

            points =
                Math.round(
                    points *
                    GAME_CONFIG.EGO_MULTIPLIER
                );

        }


        this.score +=
            points;


        // ----------------------------------------------------
        // RECUPERAÇÃO DE AURA
        // ----------------------------------------------------

        this.recoverAuraOnClick();


        // ----------------------------------------------------
        // AURA EXTRA POR HIT
        // ----------------------------------------------------

        /*
         * IMPORTANTE:
         *
         * Agora o ganho de Aura por hit passa pelo
         * mesmo sistema central de controle.
         *
         * Isso garante que, se a Aura atingir 100,
         * o level-up será processado imediatamente.
         */

        this.addAuraHP(
            GAME_CONFIG.AURA_GAIN_PER_HIT
        );


        // ----------------------------------------------------
        // EGO
        // ----------------------------------------------------

        this.checkEgoGain();


        // ----------------------------------------------------
        // ANIMAÇÃO
        // ----------------------------------------------------

        this.playHitAnimation();


        // ----------------------------------------------------
        // FEEDBACK
        // ----------------------------------------------------

        this.createCharacterClickFeedback();


        // ----------------------------------------------------
        // SOM
        // ----------------------------------------------------

        this.audio.hit();


        // ----------------------------------------------------
        // SCORE POPUP
        // ----------------------------------------------------

        this.showScorePopup(
            points
        );


        // ----------------------------------------------------
        // HUD
        // ----------------------------------------------------

        this.updateHUD();

    }


    // ========================================================
    // RECUPERAÇÃO DE HP / AURA POR CLIQUE
    // ========================================================

    recoverAuraOnClick() {

        let recovery =
            GAME_CONFIG.BASE_HP_RECOVERY_PER_CLICK;


        // ----------------------------------------------------
        // EGO 50%
        // ----------------------------------------------------

        if (
            this.egoActive &&
            this.activeEgoTier === 50
        ) {

            recovery +=
                GAME_CONFIG
                    .EGO_50_HP_BONUS_PER_CLICK;

        }


        // ----------------------------------------------------
        // EGO 75%
        // ----------------------------------------------------

        else if (
            this.egoActive &&
            this.activeEgoTier === 75
        ) {

            recovery +=
                GAME_CONFIG
                    .EGO_75_HP_BONUS_PER_CLICK;

        }


        // ----------------------------------------------------
        // EGO 100%
        // ----------------------------------------------------

        else if (
            this.egoActive &&
            this.activeEgoTier === 100
        ) {

            const currentDrain =
                this.getCurrentDrain();


            recovery +=
                currentDrain *
                GAME_CONFIG
                    .EGO_100_DRAIN_RECOVERY_RATIO;

        }


        // ----------------------------------------------------
        // APLICA RECUPERAÇÃO
        // ----------------------------------------------------

        this.addAuraHP(
            recovery
        );


        return recovery;

    }


    // ========================================================
    // SISTEMA CENTRAL DE AURA
    // ========================================================
    //
    // Toda vez que a Aura aumenta, passa por aqui.
    //
    // Isso resolve definitivamente o problema de level-up.
    //
    // ========================================================

    addAuraHP(amount) {

        if (
            this.gameOver ||
            amount <= 0
        ) {

            return;

        }


        // ----------------------------------------------------
        // NÍVEL 5
        // ----------------------------------------------------
        //
        // No nível máximo não existe level-up.
        // A Aura simplesmente fica limitada a 100.
        // ----------------------------------------------------

        if (
            this.auraLevel >= 5
        ) {

            this.aura =
                Math.min(
                    GAME_CONFIG.MAX_AURA,
                    this.aura + amount
                );

            return;

        }


        // ----------------------------------------------------
        // ADICIONA AURA
        // ----------------------------------------------------

        this.aura += amount;


        // ----------------------------------------------------
        // VERIFICA LEVEL-UP
        // ----------------------------------------------------

        if (
            this.aura >=
            GAME_CONFIG.MAX_AURA
        ) {

            this.aura =
                GAME_CONFIG.MAX_AURA;


            this.levelUpAura();

        }

    }


    // ========================================================
    // SUBIDA DE NÍVEL DA AURA
    // ========================================================

    levelUpAura() {

        if (
            this.auraLevel >= 5
        ) {

            this.aura =
                GAME_CONFIG.MAX_AURA;

            return;

        }


        // ----------------------------------------------------
        // SOBE UM NÍVEL
        // ----------------------------------------------------

        this.auraLevel++;


        // ----------------------------------------------------
        // RESET DA AURA
        // ----------------------------------------------------

        this.aura =
            GAME_CONFIG
                .AURA_RESET_AFTER_LEVEL_UP;


        // ----------------------------------------------------
        // VISUAL
        // ----------------------------------------------------

        this.updateAuraVisual();


        // ----------------------------------------------------
        // FEEDBACK

        this.showLevelUp(

        );

        this.hitAnimationSide =
            this.hitAnimationSide === "left"

        );

        );

        );

    // BRAÇOS
    // ========================================================

    setCharacterArm(side) {

        if (
            side === "left"
        ) {

            this.leftArm.rotation =
                -0.65;

            this.rightArm.rotation =
                0.25;

        }

        else {

            this.leftArm.rotation =
                -0.25;

            this.rightArm.rotation =
                0.65;

        }

    }


    // ========================================================
    // SCORE
    // ========================================================

    calculateScore() {

        let points =
            GAME_CONFIG.BASE_SCORE_PER_HIT;


        for (
            let i = 0;
            i < GAME_CONFIG.SCORE_TIERS.length;
            i++
        ) {

            const tier =
                GAME_CONFIG.SCORE_TIERS[i];


            if (
                this.combo >= tier.combo
            ) {

                points =
                    tier.points;

            }

        }


        const auraIndex =
            this.auraLevel - 1;


        const randomBonusMax =
            GAME_CONFIG
                .RANDOM_BONUS_MAX_BY_AURA[
                    auraIndex
                ];


        points +=
            Phaser.Math.Between(

                GAME_CONFIG.RANDOM_BONUS_MIN,

                randomBonusMax

            );


        return points;

    }


    // ========================================================
    // QUEDA DE NÍVEL DA AURA
    // ========================================================

    handleAuraDepletion() {

        if (
            this.aura > 0
        ) {

            return;

        }


        this.aura = 0;


        // ----------------------------------------------------
        // NÍVEL ANTERIOR
        // ----------------------------------------------------

        if (
            this.auraLevel > 1
        ) {

            this.auraLevel--;


            this.aura =
                GAME_CONFIG
                    .AURA_RESET_AFTER_LEVEL_UP;


            this.updateAuraVisual();


            this.showLevelDown(
                this.auraLevel
            );


            this.updateHUD(true);


            return;

        }


        // ----------------------------------------------------
        // NÍVEL 1 = GAME OVER
        // ----------------------------------------------------

        this.aura = 0;

        this.endGame();

    }

    // ========================================================
    // EGO
    // ========================================================

    checkEgoGain() {

        if (
            this.combo <= 0
        ) {

            return;

        }


        if (
            this.combo %
            GAME_CONFIG.HIT_COMBO_MILESTONE
            !== 0
        ) {

            return;

        }


        const oldEgo =
            this.ego;


        this.ego =
            Math.min(

                GAME_CONFIG.MAX_EGO,

                this.ego +
                GAME_CONFIG.EGO_PER_MILESTONE

            );


        if (
            this.ego > oldEgo
        ) {

            this.audio.egoGain();


            this.showFeedback(
                "+10% EGO"
            );


            this.updateEgoButton();

        }

    }

    // ========================================================
    // ATUALIZA BOTÃO EGO
    // ========================================================

    updateEgoButton() {

        if (
            this.egoActive
        ) {

            this.destroyEgoButton();

            return;

        }


        if (
            this.ego >=
            GAME_CONFIG.MIN_EGO_TO_ACTIVATE
        ) {

            this.createEgoButton();

        }

        else {

            this.destroyEgoButton();

        }

    }


    // ========================================================
    // REMOVE BOTÃO EGO
    // ========================================================

    destroyEgoButton() {

        if (
            !this.egoButton
        ) {

            return;

        }


        this.tweens.killTweensOf(
            this.egoButton
        );


        if (
            this.egoButtonGlow
        ) {

            this.tweens.killTweensOf(
                this.egoButtonGlow
            );

        }


        this.egoButton.destroy();

        this.egoButton = null;

        this.egoButtonGlow = null;

    }


    // ========================================================
    // ATIVAR EGO
    // ========================================================

    activateEgo() {

        if (
            !this.gameStarted ||
            this.gameOver ||
            this.egoActive
        ) {

            return;

        }


        if (
            this.ego <
            GAME_CONFIG.MIN_EGO_TO_ACTIVATE
        ) {

            return;

        }


        const activationCharge =
            this.ego;


        const duration =
            (
                activationCharge /
                GAME_CONFIG.MAX_EGO
            ) *
            GAME_CONFIG.EGO_MAX_DURATION;


        if (
            activationCharge >= 100
        ) {

            this.activeEgoTier = 100;

        }

        else if (
            activationCharge >= 75
        ) {

            this.activeEgoTier = 75;

        }

        else {

            this.activeEgoTier = 50;

        }


        this.activeEgoCharge =
            activationCharge;


        this.egoActive = true;


        this.egoRemainingTime =
            duration;


        this.ego = 0;


        this.destroyEgoButton();


        this.audio.egoActivate();


        this.startEgoVisual();


        this.showFeedback(
            "AURA + EGO"
        );


        this.updateHUD(true);

    }

    // ========================================================
    // FINALIZAR EGO
    // ========================================================

    endEgo() {

        this.egoActive = false;

        this.egoRemainingTime = 0;

        this.activeEgoTier = 0;

        this.activeEgoCharge = 0;


        this.audio.egoEnd();


        this.character.setScale(
            GAME_CONFIG.CHARACTER_SCALE
        );


        if (
            this.egoOverlay
        ) {

            this.tweens.killTweensOf(
                this.egoOverlay
            );


            this.egoOverlay.destroy();


            this.egoOverlay = null;

        if (
            this.egoGlow
        ) {

            this.tweens.killTweensOf(
                this.egoGlow
            );


            this.egoGlow.destroy();


            this.egoGlow = null;

        this.egoTimerText.setText("");


        this.updateHUD(true);

    }

    // ========================================================
    // ATUALIZA HUD
    // ========================================================

    updateHUD(force = false) {

        this.scoreText.setText(

            this.score.toLocaleString(
                "pt-BR"
            )

        );


        this.comboText.setText(

            "COMBO " +
            this.combo

        );


        const levelData =
            AURA_LEVELS[
                this.auraLevel - 1
            ];


        const auraPercent =
            Phaser.Math.Clamp(

                this.aura /
                GAME_CONFIG.MAX_AURA,

                0,
                1

            );


        const auraRounded =
            Math.round(
                auraPercent * 100
            );


        this.hpBar.width =
            this.hpWidth *
            auraPercent;


        this.hpBar.setFillStyle(
            levelData.color
        );


        this.hpText.setText(

            "AURA " +
            auraRounded +
            "%"

        );


        this.auraDots.forEach(

            (dot, index) => {

                const active =
                    index <
                    this.auraLevel;


                const dotData =
                    AURA_LEVELS[index];


                dot.setFillStyle(

                    dotData.color,

                    active
                        ? 1
                        : 0.12

                );


                dot.setStrokeStyle(

                    2,

                    dotData.color,

                    active
                        ? 0.9
                        : 0.25

                );

            }

        );


        this.egoBar.width =
            this.hpWidth *
            (
                this.ego /
                GAME_CONFIG.MAX_EGO
            );


        if (
            this.egoActive
        ) {

            this.egoTimerText.setText(

                "AURA + EGO   " +
                (
                    this.egoRemainingTime /
                    1000
                ).toFixed(1) +
                "s"

            );

        }

        else {

            this.egoTimerText.setText("");

        }


        this.difficultyText.setText(

            "DIFICULDADE " +
            this.difficultyLevel

        );


        this.updateEgoButton();

    }


    // ========================================================
    // DRENAGEM
    // ========================================================

    getCurrentDrain() {

    const auraDrainMultiplier =
        GAME_CONFIG.DRAIN_BY_AURA_LEVEL[
            this.auraLevel - 1
        ];

    return (

        GAME_CONFIG.BASE_DRAIN_PER_SECOND *

        auraDrainMultiplier *

        Math.pow(
            1 + GAME_CONFIG.DRAIN_INCREASE,
            this.difficultyLevel
        )

    );

}


    // ========================================================
    // MÚSICA
    // ========================================================

    createMusicControl() {

        const x =
            this.gameWidth - 30;


        const y =
            30;


        this.musicButton =
            this.add.circle(
                x,
                y,
                20,
                0x1f2937,
                0.90
            );


        this.musicButton.setStrokeStyle(
            2,
            0x6b7280,
            0.70
        );


        this.musicIcon =
            this.add.text(

                x,
                y,

                "♪",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "20px",

                    fontStyle:
                        "bold",

                    color:
                        "#6b7280"

                }

            ).setOrigin(0.5);


        this.musicButton.setInteractive({

            useHandCursor:
                !IS_MOBILE

        });


        this.musicIcon.setInteractive({

            useHandCursor:
                !IS_MOBILE

        });


        const toggle =
            event => {

                if (
                    event &&
                    event.preventDefault
                ) {

                    event.preventDefault();

                }


                const enabled =
                    this.audio.toggleMusic();


                this.updateMusicButton(
                    enabled
                );

            };


        this.musicButton.on(
            "pointerdown",
            toggle
        );


        this.musicIcon.on(
            "pointerdown",
            toggle
        );


        this.updateMusicButton(
            this.audio.musicEnabled
        );

    }


    updateMusicButton(enabled) {

        if (!this.musicButton) {
            return;
        }


        if (enabled) {

            this.musicButton.setFillStyle(
                0x312e81,
                0.95
            );


            this.musicButton.setStrokeStyle(
                2,
                0xa78bfa,
                0.90
            );


            this.musicIcon.setColor(
                "#a78bfa"
            );

        }

        else {

            this.musicButton.setFillStyle(
                0x1f2937,
                0.90
            );


            this.musicButton.setStrokeStyle(
                2,
                0x6b7280,
                0.70
            );


            this.musicIcon.setColor(
                "#6b7280"
            );

        }

    }


    // ========================================================
    // START SCREEN
    // ========================================================

    createStartScreen() {

        this.startOverlay =
            this.add.rectangle(

                0,
                0,

                this.gameWidth,
                this.gameHeight,

                0x000000,
                0.88

            ).setOrigin(0, 0);


        this.startOverlay.setDepth(100);


        this.startTitle =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.32,

                "AURA FARMING",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        IS_MOBILE
                            ? "44px"
                            : "58px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                    stroke:
                        "#090b14",

                    strokeThickness:
                        6

                }

            ).setOrigin(0.5);


        this.startTitle.setDepth(101);


        this.startSubtitle =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.43,

                "FARME AURA ATÉ O INFINITO",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:
                        "#a78bfa"

                }

            ).setOrigin(0.5);


        this.startSubtitle.setDepth(101);


        this.startInstruction =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.51,

                IS_MOBILE
                    ? "TOQUE REPETIDAMENTE NO PERSONAGEM\n" +
                      "PARA FARMAR AURA"
                    : "CLIQUE REPETIDAMENTE NO PERSONAGEM\n" +
                      "BOTÃO DIREITO ATIVA O EGO",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "17px",

                    color:
                        "#d1d5db",

                    align:
                        "center",

                    lineSpacing:
                        8,

                    wordWrap: {

                        width:
                            this.gameWidth * 0.8

                    }

                }

            ).setOrigin(0.5);


        this.startInstruction.setDepth(101);


        this.startButton =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.62,

                "COMEÇAR",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                    backgroundColor:
                        "#6366f1",

                    padding: {

                        left: 38,
                        right: 38,

                        top: 16,
                        bottom: 16

                    }

                }

            ).setOrigin(0.5);


        this.startButton.setDepth(101);


        this.startButton.setInteractive({

            useHandCursor:
                !IS_MOBILE

        });


        this.startButton.on(

            "pointerdown",

            () => {

                this.startGame();

            }

        );

    }


    // ========================================================
    // START GAME
    // ========================================================

    startGame() {

        if (
            this.gameStarted
        ) {

            return;

        }


        this.gameStarted = true;


        this.audio.init();


        if (
            this.audio.musicEnabled
        ) {

            this.audio.startMusic();

        }


        const elements = [

            "startOverlay",
            "startTitle",
            "startSubtitle",
            "startInstruction",
            "startButton"

        ];


        elements.forEach(
            key => {

                if (
                    this[key]
                ) {

                    this[key].destroy();

                    this[key] = null;

                }

            }
        );


        this.showFeedback(
            "COMEÇOU!"
        );


        this.updateHUD(true);

    }


    // ========================================================
    // GAME OVER
    // ========================================================

    endGame() {

        if (
            this.gameOver
        ) {

            return;

        }


        this.gameOver = true;


        if (
            this.egoActive
        ) {

            this.endEgo();

        }


        this.destroyEgoButton();


        this.audio.stopMusic();


        const overlay =
            this.add.rectangle(

                0,
                0,

                this.gameWidth,
                this.gameHeight,

                0x000000,
                0.88

            ).setOrigin(0, 0);


        overlay.setDepth(50);


        const title =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.29,

                "IT'S OVER PARA O BETA",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        IS_MOBILE
                            ? "46px"
                            : "64px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff"

                }

            ).setOrigin(0.5);


        title.setDepth(51);


        const score =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.42,

                "PONTUAÇÃO  " +
                this.score.toLocaleString(
                    "pt-BR"
                ),

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "30px",

                    fontStyle:
                        "bold",

                    color:
                        "#a78bfa"

                }

            ).setOrigin(0.5);


        score.setDepth(51);


        const combo =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.50,

                "COMBO MÁXIMO  " +
                this.maxCombo,

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:
                        "#c4b5fd"

                }

            ).setOrigin(0.5);


        combo.setDepth(51);


        const restartText =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.66,

                "TOQUE NA TELA PARA JOGAR NOVAMENTE",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        IS_MOBILE
                            ? "15px"
                            : "18px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                    align:
                        "center",

                    wordWrap: {

                        width:
                            this.gameWidth * 0.8

                    }

                }

            ).setOrigin(0.5);


        restartText.setDepth(51);


        this.input.once(

            "pointerdown",

            () => {

                this.scene.restart();

            }

        );


        this.input.keyboard.once(

            "keydown-ENTER",

            () => {

                this.scene.restart();

            }

        );

    }


    // ========================================================
    // RESIZE
    // ========================================================

    handleResize(gameSize) {

        const width =
            gameSize.width;


        const height =
            gameSize.height;


        this.gameWidth =
            width;


        this.gameHeight =
            height;


        if (
            this.background
        ) {

            this.background.width =
                width;

            this.background.height =
                height;

        }


        if (
            this.egoOverlay
        ) {

            this.egoOverlay.width =
                width;

            this.egoOverlay.height =
                height;

        }

    }


    // ========================================================
    // UPDATE
    // ========================================================

    update(time, delta) {

        if (
            !this.gameStarted ||
            this.gameOver
        ) {

            return;

        }


        // ----------------------------------------------------
        // DIFICULDADE
        // ----------------------------------------------------

        this.difficultyTimer +=
            delta;


        if (
            this.difficultyTimer >=
            GAME_CONFIG.DIFFICULTY_INTERVAL
        ) {

            this.difficultyTimer -=
                GAME_CONFIG.DIFFICULTY_INTERVAL;


            this.difficultyLevel++;


            this.showFeedback(

                "DIFICULDADE " +
                this.difficultyLevel

            );


            this.updateHUD();

        }


        // ----------------------------------------------------
        // DRENAGEM DA AURA
        // ----------------------------------------------------

        const drainPerSecond =
            this.getCurrentDrain();


        this.aura -=
            drainPerSecond *
            (
                delta /
                1000
            );


        // ----------------------------------------------------
        // QUEDA DE NÍVEL
        // ----------------------------------------------------

        if (
            this.aura <= 0
        ) {

            this.aura = 0;

            this.handleAuraDepletion();

        }


        // ----------------------------------------------------
        // MOVIMENTO DO FUNDO
        // ----------------------------------------------------

        const backgroundSpeed =
            GAME_CONFIG
                .AURA_BACKGROUND_SPEED[
                    this.auraLevel - 1
                ];


        if (
            this.particles
        ) {

            const movement =
                backgroundSpeed *
                (
                    delta /
                    1000
                );


            this.particles.forEach(

                particle => {

                    particle.y +=
                        movement *
                        particle.baseSpeed;


                    if (
                        particle.y >
                        this.playAreaBottom + 10
                    ) {

                        particle.y =
                            this.playAreaTop - 10;


                        particle.x =
                            Phaser.Math.Between(
                                0,
                                this.gameWidth
                            );


                        particle.baseSpeed =
                            Phaser.Math.FloatBetween(
                                0.75,
                                1.35
                            );

                    }

                }

            );

        }


        // ----------------------------------------------------
        // AURA DO PERSONAGEM
        // ----------------------------------------------------

        if (
            this.characterAura
        ) {

            this.characterAura.x =
                this.character.x;


            this.characterAura.y =
                this.character.y;

        }


        // ----------------------------------------------------
        // HITBOX
        // ----------------------------------------------------

        if (
            this.characterHitArea
        ) {

            this.characterHitArea.x =
                this.character.x;


            this.characterHitArea.y =
                this.character.y + 35;

        }


        // ----------------------------------------------------
        // ANEL
        // ----------------------------------------------------

        if (
            this.clickRing
        ) {

            this.clickRing.x =
                this.character.x;


            this.clickRing.y =
                this.character.y + 20;

        }


        // ----------------------------------------------------
        // EGO
        // ----------------------------------------------------

        if (
            this.egoActive
        ) {

            this.egoRemainingTime -=
                delta;


            if (
                this.egoRemainingTime <=
                0
            ) {

                this.endEgo();

            }

        }


        // ----------------------------------------------------
        // TIMER HUD
        // ----------------------------------------------------

        this.updateHUD();

    }

}


// ============================================================
// PHASER CONFIG
// ============================================================

const config = {

    type:
        Phaser.AUTO,

    width:
        window.innerWidth,

    height:
        window.innerHeight,

    backgroundColor:
        "#090b14",

    scene:
        FarmAuraScene,

    scale: {

        mode:
            Phaser.Scale.RESIZE,

        autoCenter:
            Phaser.Scale.CENTER_BOTH

    }

};


// ============================================================
// START
// ============================================================

new Phaser.Game(config);

</script>
