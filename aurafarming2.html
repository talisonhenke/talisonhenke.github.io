<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >

    <title>Farm Aura — Prototype</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #090b14;

            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;

        }

        canvas {

            display: block;

        }

    </style>

</head>


<body>


<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>


<script>


// ============================================================
// CONFIGURAÇÃO GERAL
// ============================================================

const GAME_CONFIG = {

    STARTING_AURA: 50,

    MAX_AURA: 100,

    BASE_DRAIN_PER_SECOND: 7,

    DIFFICULTY_INTERVAL: 3000,

    DRAIN_INCREASE: 0.10,


    BASE_SCORE_PER_HIT: 10,


    SCORE_TIERS: [

        { combo: 1, points: 10 },
        { combo: 10, points: 20 },
        { combo: 25, points: 35 },
        { combo: 50, points: 60 },
        { combo: 75, points: 100 },
        { combo: 100, points: 150 },
        { combo: 150, points: 250 },
        { combo: 200, points: 350 }

    ],


    RANDOM_BONUS_MIN: 1,

    RANDOM_BONUS_MAX_BY_AURA: [
        20,
        40,
        60,
        80,
        100
    ],


    AURA_GAIN_PER_HIT: 2,

    AURA_RESET_AFTER_LEVEL_UP: 50,


    HIT_COMBO_MILESTONE: 30,

    EGO_PER_MILESTONE: 10,

    EGO_LOSS_PER_MISS: 5,

    MIN_EGO_TO_ACTIVATE: 50,

    MAX_EGO: 100,

    EGO_MAX_DURATION: 15000,

    EGO_MULTIPLIER: 2,


    CHARACTER_SCALE: 1.05,

    EGO_CHARACTER_SCALE: 1.16

};



// ============================================================
// CORES
// ============================================================

const AURA_LEVELS = [

    {
        level: 1,
        color: 0x60a5fa,
        hex: "#60a5fa"
    },

    {
        level: 2,
        color: 0x34d399,
        hex: "#34d399"
    },

    {
        level: 3,
        color: 0xfacc15,
        hex: "#facc15"
    },

    {
        level: 4,
        color: 0xfb923c,
        hex: "#fb923c"
    },

    {
        level: 5,
        color: 0xf43f5e,
        hex: "#f43f5e"
    }

];



// ============================================================
// DETECÇÃO MOBILE
// ============================================================

const IS_MOBILE =
    window.matchMedia(
        "(max-width: 700px)"
    ).matches ||
    "ontouchstart" in window;



// ============================================================
// AUDIO SYSTEM
// ============================================================

class AudioSystem {


    constructor() {

        this.audioContext = null;

    }


    init() {

        if (!this.audioContext) {

            this.audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            this.audioContext.state === "suspended"
        ) {

            return this.audioContext.resume();

        }


        return Promise.resolve();

    }


    tone(
        frequency,
        time,
        duration,
        type,
        volume
    ) {

        if (!this.audioContext) return;


        const oscillator =
            this.audioContext.createOscillator();


        const gain =
            this.audioContext.createGain();


        oscillator.type =
            type;


        oscillator.frequency.setValueAtTime(
            frequency,
            time
        );


        gain.gain.setValueAtTime(
            volume,
            time
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time + duration
        );


        oscillator.connect(gain);

        gain.connect(
            this.audioContext.destination
        );


        oscillator.start(time);

        oscillator.stop(
            time + duration
        );

    }


    hit() {

        if (!this.audioContext) return;


        const now =
            this.audioContext.currentTime;


        this.tone(
            420,
            now,
            0.05,
            "triangle",
            0.035
        );

    }


    levelUp(level) {

        if (!this.audioContext) return;


        const now =
            this.audioContext.currentTime;


        this.tone(
            400 + level * 60,
            now,
            0.08,
            "triangle",
            0.06
        );


        this.tone(
            600 + level * 70,
            now + 0.07,
            0.12,
            "triangle",
            0.07
        );

    }


    egoGain() {

        if (!this.audioContext) return;


        const now =
            this.audioContext.currentTime;


        this.tone(
            520,
            now,
            0.08,
            "triangle",
            0.08
        );


        this.tone(
            780,
            now + 0.06,
            0.12,
            "triangle",
            0.09
        );

    }


    egoLoss() {

        if (!this.audioContext) return;


        const now =
            this.audioContext.currentTime;


        this.tone(
            300,
            now,
            0.10,
            "sawtooth",
            0.07
        );


        this.tone(
            180,
            now + 0.06,
            0.12,
            "sawtooth",
            0.06
        );

    }


    egoActivate() {

        if (!this.audioContext) return;


        const now =
            this.audioContext.currentTime;


        this.tone(
            440,
            now,
            0.10,
            "sine",
            0.07
        );


        this.tone(
            660,
            now + 0.07,
            0.10,
            "sine",
            0.08
        );


        this.tone(
            880,
            now + 0.14,
            0.18,
            "sine",
            0.10
        );

    }


    egoEnd() {

        if (!this.audioContext) return;


        const now =
            this.audioContext.currentTime;


        this.tone(
            440,
            now,
            0.12,
            "triangle",
            0.05
        );


        this.tone(
            330,
            now + 0.08,
            0.18,
            "triangle",
            0.04
        );

    }

}



// ============================================================
// GAME SCENE
// ============================================================

class FarmAuraScene extends Phaser.Scene {


    constructor() {

        super("FarmAuraScene");

    }



    // ========================================================
    // CREATE
    // ========================================================

    create() {


        this.gameWidth =
            this.scale.width;


        this.gameHeight =
            this.scale.height;


        // ----------------------------------------------------
        // ÁREA DE JOGO
        // ----------------------------------------------------

        this.playAreaTop = 250;


        this.playAreaBottom =
            this.gameHeight - 95;


        if (
            this.playAreaBottom <=
            this.playAreaTop + 180
        ) {

            this.playAreaTop =
                Math.max(
                    230,
                    this.gameHeight * 0.36
                );


            this.playAreaBottom =
                this.gameHeight - 70;

        }


        this.playAreaHeight =
            this.playAreaBottom -
            this.playAreaTop;


        // ----------------------------------------------------
        // ESTADO
        // ----------------------------------------------------

        this.gameStarted = false;

        this.gameOver = false;


        this.aura =
            GAME_CONFIG.STARTING_AURA;


        this.auraLevel = 1;


        this.combo = 0;

        this.maxCombo = 0;


        this.score = 0;


        this.ego = 0;

        this.egoActive = false;

        this.egoRemainingTime = 0;


        this.difficultyLevel = 0;

        this.difficultyTimer = 0;


        this.lastClick = null;


        // ----------------------------------------------------
        // AUDIO
        // ----------------------------------------------------

        this.audio =
            new AudioSystem();


        // ----------------------------------------------------
        // BACKGROUND
        // ----------------------------------------------------

        this.createBackground();


        // ----------------------------------------------------
        // PERSONAGEM
        // ----------------------------------------------------

        this.createCharacter();


        // ----------------------------------------------------
        // HUD
        // ----------------------------------------------------

        this.createHUD();


        // ----------------------------------------------------
        // CONTROLES MOBILE
        // ----------------------------------------------------

        this.createMobileControls();


        // ----------------------------------------------------
        // INPUT
        // ----------------------------------------------------

        this.input.on(
            "pointerdown",
            pointer => {

                this.handleClick(
                    pointer.button
                );

            }
        );


        this.input.keyboard.on(
            "keydown",
            event => {

                this.handleKeyboardInput(
                    event
                );

            }
        );


        // ----------------------------------------------------
        // START
        // ----------------------------------------------------

        this.createStartScreen();


        // ----------------------------------------------------
        // PRIMEIRA ATUALIZAÇÃO
        // ----------------------------------------------------

        this.updateHUD(true);

    }



    // ========================================================
    // BACKGROUND
    // ========================================================

    createBackground() {


        this.background =
            this.add.rectangle(

                0,
                0,

                this.gameWidth,
                this.gameHeight,

                0x090b14

            ).setOrigin(0, 0);


        this.centerGlow =
            this.add.circle(

                this.gameWidth / 2,

                this.playAreaTop +
                this.playAreaHeight * 0.52,

                280,

                0x6366f1,

                0.035

            );


        this.tweens.add({

            targets:
                this.centerGlow,

            scale:
                1.12,

            alpha:
                0.06,

            duration:
                1800,

            yoyo:
                true,

            repeat:
                -1,

            ease:
                "Sine.easeInOut"

        });


        this.particles = [];


        for (
            let i = 0;
            i < 35;
            i++
        ) {

            const particle =
                this.add.circle(

                    Phaser.Math.Between(
                        0,
                        this.gameWidth
                    ),

                    Phaser.Math.Between(
                        this.playAreaTop,
                        this.playAreaBottom
                    ),

                    Phaser.Math.Between(
                        1,
                        3
                    ),

                    0x818cf8,

                    Phaser.Math.FloatBetween(
                        0.15,
                        0.45
                    )

                );


            this.particles.push(
                particle
            );

        }

    }



    // ========================================================
    // PERSONAGEM
    // ========================================================

    createCharacter() {


        const characterX =
            this.gameWidth / 2;


        const characterY =
            this.playAreaTop +
            this.playAreaHeight * 0.55;


        this.character =
            this.add.container(
                characterX,
                characterY
            );


        this.character.setScale(
            GAME_CONFIG.CHARACTER_SCALE
        );


        const body =
            this.add.rectangle(
                0,
                30,
                60,
                95,
                0xf97316
            );


        const head =
            this.add.circle(
                0,
                -35,
                36,
                0xf5c6a5
            );


        const eyeLeft =
            this.add.circle(
                -11,
                -40,
                4,
                0x111827
            );


        const eyeRight =
            this.add.circle(
                11,
                -40,
                4,
                0x111827
            );


        this.leftArm =
            this.add.rectangle(
                -46,
                25,
                16,
                72,
                0xf5c6a5
            );


        this.rightArm =
            this.add.rectangle(
                46,
                25,
                16,
                72,
                0xf5c6a5
            );


        const leftLeg =
            this.add.rectangle(
                -18,
                105,
                18,
                60,
                0x1f2937
            );


        const rightLeg =
            this.add.rectangle(
                18,
                105,
                18,
                60,
                0x1f2937
            );


        this.character.add([

            body,
            head,

            eyeLeft,
            eyeRight,

            this.leftArm,
            this.rightArm,

            leftLeg,
            rightLeg

        ]);


        this.leftArmBaseRotation = 0;

        this.rightArmBaseRotation = 0;

    }



    // ========================================================
    // BRAÇOS
    // ========================================================

    animateArm(side) {


        const arm =
            side === "left"
                ? this.leftArm
                : this.rightArm;


        const baseRotation =
            side === "left"
                ? this.leftArmBaseRotation
                : this.rightArmBaseRotation;


        this.tweens.killTweensOf(
            arm
        );


        arm.rotation =
            baseRotation;


        const direction =
            side === "left"
                ? -1
                : 1;


        arm.rotation =
            direction * 0.55;


        this.tweens.add({

            targets:
                arm,

            rotation:
                baseRotation,

            duration:
                45,

            ease:
                "Quad.easeOut"

        });

    }



    // ========================================================
    // INPUT TECLADO
    // ========================================================

    handleKeyboardInput(event) {


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            this.activateEgo();

            return;

        }


        if (
            event.code === "KeyA" ||
            event.code === "ArrowLeft"
        ) {

            event.preventDefault();

            this.handleClick("left");

            return;

        }


        if (
            event.code === "KeyD" ||
            event.code === "ArrowRight"
        ) {

            event.preventDefault();

            this.handleClick("right");

            return;

        }

    }



    // ========================================================
    // CONTROLES MOBILE
    // ========================================================

    createMobileControls() {


        this.mobileControls = [];


        if (!IS_MOBILE) {

            return;

        }


        const buttonY =
            this.gameHeight * 0.78;


        const buttonSize =
            Math.min(
                100,
                Math.max(
                    72,
                    this.gameWidth * 0.20
                )
            );


        const sideMargin =
            Math.max(
                24,
                this.gameWidth * 0.08
            );


        // ----------------------------------------------------
        // BOTÃO ESQUERDO
        // ----------------------------------------------------

        this.mobileLeftButton =
            this.add.circle(

                sideMargin +
                buttonSize / 2,

                buttonY,

                buttonSize / 2,

                0x1f2937,

                0.85

            );


        this.mobileLeftButton.setStrokeStyle(
            3,
            0x60a5fa,
            0.75
        );


        this.mobileLeftButton.setInteractive({
            useHandCursor: false
        });


        this.mobileLeftButton.on(
            "pointerdown",
            pointer => {

                pointer.event.preventDefault();

                this.audio.init();

                this.handleClick("left");

            }
        );


        this.mobileLeftButton.on(
            "pointerup",
            pointer => {

                pointer.event.preventDefault();

            }
        );


        this.mobileLeftButton.on(
            "pointerout",
            pointer => {

                pointer.event.preventDefault();

            }
        );


        this.add.text(

            sideMargin +
            buttonSize / 2,

            buttonY,

            "←",

            {

                fontFamily:
                    "Arial",

                fontSize:
                    Math.round(
                        buttonSize * 0.42
                    ) + "px",

                fontStyle:
                    "bold",

                color:
                    "#60a5fa"

            }

        ).setOrigin(0.5);


        // ----------------------------------------------------
        // BOTÃO DIREITO
        // ----------------------------------------------------

        this.mobileRightButton =
            this.add.circle(

                this.gameWidth -
                sideMargin -
                buttonSize / 2,

                buttonY,

                buttonSize / 2,

                0x1f2937,

                0.85

            );


        this.mobileRightButton.setStrokeStyle(
            3,
            0x34d399,
            0.75
        );


        this.mobileRightButton.setInteractive({
            useHandCursor: false
        });


        this.mobileRightButton.on(
            "pointerdown",
            pointer => {

                pointer.event.preventDefault();

                this.audio.init();

                this.handleClick("right");

            }
        );


        this.mobileRightButton.on(
            "pointerup",
            pointer => {

                pointer.event.preventDefault();

            }
        );


        this.mobileRightButton.on(
            "pointerout",
            pointer => {

                pointer.event.preventDefault();

            }
        );


        this.add.text(

            this.gameWidth -
            sideMargin -
            buttonSize / 2,

            buttonY,

            "→",

            {

                fontFamily:
                    "Arial",

                fontSize:
                    Math.round(
                        buttonSize * 0.42
                    ) + "px",

                fontStyle:
                    "bold",

                color:
                    "#34d399"

            }

        ).setOrigin(0.5);


        this.mobileControls.push(
            this.mobileLeftButton,
            this.mobileRightButton
        );

    }



    // ========================================================
    // CLICK
    // ========================================================

    handleClick(input) {


        if (
            !this.gameStarted ||
            this.gameOver
        ) {

            return;

        }


        this.audio.init();


        let side = null;


        if (input === 0) {

            side = "left";

        }

        else if (input === 2) {

            side = "right";

        }

        else if (input === "left") {

            side = "left";

        }

        else if (input === "right") {

            side = "right";

        }


        if (!side) {

            return;

        }


        // ----------------------------------------------------
        // ERRO DE ALTERNÂNCIA
        // ----------------------------------------------------

        if (
            this.lastClick === side
        ) {

            this.miss();

            return;

        }


        this.lastClick =
            side;


        // ----------------------------------------------------
        // COMBO
        // ----------------------------------------------------

        this.combo++;

        this.maxCombo =
            Math.max(
                this.maxCombo,
                this.combo
            );


        // ----------------------------------------------------
        // SCORE
        // ----------------------------------------------------

        let points =
            this.calculateScore();


        if (
            this.egoActive
        ) {

            points =
                Math.round(
                    points *
                    GAME_CONFIG.EGO_MULTIPLIER
                );

        }


        this.score +=
            points;


        // ----------------------------------------------------
        // AURA
        // ----------------------------------------------------

        this.addAuraHP();


        // ----------------------------------------------------
        // EGO
        // ----------------------------------------------------

        this.checkEgoGain();


        // ----------------------------------------------------
        // ANIMAÇÃO
        // ----------------------------------------------------

        this.animateArm(side);


        // ----------------------------------------------------
        // SOM
        // ----------------------------------------------------

        this.audio.hit();


        // ----------------------------------------------------
        // FEEDBACK
        // ----------------------------------------------------

        this.showScorePopup(points);


        // ----------------------------------------------------
        // HUD
        // ----------------------------------------------------

        this.updateHUD();

    }



    // ========================================================
    // SCORE
    // ========================================================

    calculateScore() {


        let points =
            GAME_CONFIG.BASE_SCORE_PER_HIT;


        for (
            let i = 0;
            i < GAME_CONFIG.SCORE_TIERS.length;
            i++
        ) {

            const tier =
                GAME_CONFIG.SCORE_TIERS[i];


            if (
                this.combo >= tier.combo
            ) {

                points =
                    tier.points;

            }

        }


        const auraIndex =
            this.auraLevel - 1;


        const randomBonusMax =
            GAME_CONFIG
                .RANDOM_BONUS_MAX_BY_AURA[
                    auraIndex
                ];


        points +=
            Phaser.Math.Between(

                GAME_CONFIG.RANDOM_BONUS_MIN,

                randomBonusMax

            );


        return points;

    }



    // ========================================================
    // AURA
    // ========================================================

    addAuraHP() {


        this.aura +=
            GAME_CONFIG.AURA_GAIN_PER_HIT;


        if (
            this.aura >=
            GAME_CONFIG.MAX_AURA
        ) {


            if (
                this.auraLevel < 5
            ) {

                this.auraLevel++;

                this.aura =
                    GAME_CONFIG.AURA_RESET_AFTER_LEVEL_UP;


                this.showLevelUp(
                    this.auraLevel
                );


                this.audio.levelUp(
                    this.auraLevel
                );

            }

            else {

                this.aura =
                    GAME_CONFIG.MAX_AURA;

            }

        }

    }



    // ========================================================
    // MISS
    // ========================================================

    miss() {


        if (
            this.gameOver
        ) {

            return;

        }


        this.combo = 0;

        this.lastClick = null;


        if (
            this.ego > 0
        ) {

            this.ego =
                Math.max(

                    0,

                    this.ego -
                    GAME_CONFIG.EGO_LOSS_PER_MISS

                );


            this.audio.egoLoss();

        }


        if (
            this.auraLevel > 1
        ) {

            this.auraLevel--;


            this.aura =
                GAME_CONFIG.AURA_RESET_AFTER_LEVEL_UP;


            this.showFeedback(
                "NÍVEL " +
                this.auraLevel
            );

        }

        else {

            this.aura -= 10;


            this.aura =
                Math.max(
                    0,
                    this.aura
                );


            this.showFeedback(
                "MISS"
            );

        }


        this.updateHUD();

    }



    // ========================================================
    // EGO
    // ========================================================

    checkEgoGain() {


        if (
            this.combo <= 0
        ) {

            return;

        }


        if (
            this.combo %
            GAME_CONFIG.HIT_COMBO_MILESTONE
            !== 0
        ) {

            return;

        }


        const oldEgo =
            this.ego;


        this.ego =
            Math.min(

                GAME_CONFIG.MAX_EGO,

                this.ego +
                GAME_CONFIG.EGO_PER_MILESTONE

            );


        if (
            this.ego > oldEgo
        ) {

            this.audio.egoGain();


            this.showFeedback(
                "+10% EGO"
            );

        }

    }



    // ========================================================
    // ATIVAR EGO
    // ========================================================

    activateEgo() {


        if (
            this.gameOver ||
            this.egoActive
        ) {

            return;

        }


        if (
            this.ego <
            GAME_CONFIG.MIN_EGO_TO_ACTIVATE
        ) {

            this.showFeedback(
                "EGO INSUFICIENTE"
            );

            return;

        }


        const duration =
            (
                this.ego /
                GAME_CONFIG.MAX_EGO
            ) *
            GAME_CONFIG.EGO_MAX_DURATION;


        this.egoActive = true;

        this.egoRemainingTime =
            duration;


        this.ego = 0;


        this.audio.egoActivate();


        this.startEgoVisual();


        this.showFeedback(
            "EGO ATIVO!"
        );


        this.updateHUD();

    }



    // ========================================================
    // VISUAL EGO
    // ========================================================

    startEgoVisual() {


        this.character.setScale(
            GAME_CONFIG.EGO_CHARACTER_SCALE
        );


        this.egoOverlay =
            this.add.rectangle(

                0,
                0,

                this.gameWidth,
                this.gameHeight,

                0x8b5cf6,
                0.06

            ).setOrigin(0, 0);


        this.tweens.add({

            targets:
                this.egoOverlay,

            alpha:
                0.16,

            duration:
                400,

            yoyo:
                true,

            repeat:
                -1

        });


        this.egoGlow =
            this.add.circle(

                this.gameWidth / 2,

                this.playAreaTop +
                this.playAreaHeight * 0.55,

                90,

                0xa78bfa,

                0.10

            );


        this.tweens.add({

            targets:
                this.egoGlow,

            scale:
                1.35,

            alpha:
                0.02,

            duration:
                500,

            yoyo:
                true,

            repeat:
                -1

        });

    }



    // ========================================================
    // FINALIZAR EGO
    // ========================================================

    endEgo() {


        this.egoActive = false;

        this.egoRemainingTime = 0;


        this.audio.egoEnd();


        this.character.setScale(
            GAME_CONFIG.CHARACTER_SCALE
        );


        if (
            this.egoOverlay
        ) {

            this.tweens.killTweensOf(
                this.egoOverlay
            );

            this.egoOverlay.destroy();

            this.egoOverlay = null;

        }


        if (
            this.egoGlow
        ) {

            this.tweens.killTweensOf(
                this.egoGlow
            );

            this.egoGlow.destroy();

            this.egoGlow = null;

        }


        this.egoTimerText.setText("");

    }



    // ========================================================
    // SCORE POPUP
    // ========================================================

    showScorePopup(points) {


        const safeTop =
            this.playAreaTop + 20;


        const safeBottom =
            this.playAreaTop +
            this.playAreaHeight * 0.55;


        const randomX =
            this.gameWidth / 2 +
            Phaser.Math.Between(
                -110,
                110
            );


        let randomY =
            this.playAreaTop +
            Phaser.Math.Between(
                35,
                Math.max(
                    40,
                    Math.floor(
                        this.playAreaHeight * 0.48
                    )
                )
            );


        randomY =
            Phaser.Math.Clamp(
                randomY,
                safeTop,
                safeBottom
            );


        const levelData =
            AURA_LEVELS[
                this.auraLevel - 1
            ];


        const text =
            this.add.text(

                randomX,
                randomY,

                "+" + points,

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        points >= 300
                            ? "32px"
                            : points >= 100
                                ? "27px"
                                : "20px",

                    fontStyle:
                        "bold",

                    color:
                        this.egoActive
                            ? "#fbbf24"
                            : levelData.hex,

                    stroke:
                        "#090b14",

                    strokeThickness:
                        4

                }

            );


        text.setOrigin(0.5);


        const targetY =
            Math.max(
                safeTop + 10,
                randomY - 75
            );


        this.tweens.add({

            targets:
                text,

            y:
                targetY,

            alpha:
                0,

            scale:
                points >= 300
                    ? 1.18
                    : 1.08,

            duration:
                700,

            ease:
                "Quad.easeOut",

            onComplete: () => {

                text.destroy();

            }

        });

    }



    // ========================================================
    // LEVEL UP
    // ========================================================

    showLevelUp(level) {


        const levelData =
            AURA_LEVELS[
                level - 1
            ];


        const feedbackY =
            this.playAreaTop + 45;


        this.levelFeedback =
            this.add.text(

                this.gameWidth / 2,

                feedbackY,

                "NÍVEL " + level,

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "38px",

                    fontStyle:
                        "bold",

                    color:
                        levelData.hex,

                    stroke:
                        "#090b14",

                    strokeThickness:
                        5

                }

            );


        this.levelFeedback.setOrigin(0.5);


        this.tweens.add({

            targets:
                this.levelFeedback,

            scale:
                1.18,

            alpha:
                0,

            duration:
                800,

            ease:
                "Quad.easeOut",

            onComplete: () => {

                this.levelFeedback.destroy();

            }

        });


        if (
            this.auraDots
        ) {

            this.auraDots.forEach(
                dot => {

                    this.tweens.add({

                        targets:
                            dot,

                        scale:
                            1.5,

                        duration:
                            180,

                        yoyo:
                            true,

                        ease:
                            "Sine.easeOut"

                    });

                }
            );

        }

    }



    // ========================================================
    // FEEDBACK
    // ========================================================

    showFeedback(text) {


        this.feedbackText.setText(
            text
        );


        this.feedbackText.setAlpha(1);

        this.feedbackText.setScale(1);


        this.tweens.killTweensOf(
            this.feedbackText
        );


        this.feedbackText.y =
            this.playAreaTop + 95;


        this.tweens.add({

            targets:
                this.feedbackText,

            scale:
                1.10,

            alpha:
                0,

            duration:
                500

        });

    }



    // ========================================================
    // HUD
    // ========================================================

    createHUD() {

                "0",

                    fontFamily:
                        "Arial",

                    fontSize:
                        "42px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                    stroke:
                        "#090b14",

                    strokeThickness:
                        5

                }

            ).setOrigin(0.5);


        this.scoreLabel =
            this.add.text(

                this.gameWidth / 2,

                76,

                "SCORE",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "13px",

                    fontStyle:
                        "bold",

                    color:
                        "#9ca3af"

                }

            ).setOrigin(0.5);


        this.comboText =
            this.add.text(

                this.gameWidth / 2,

                112,

                "COMBO 0",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:

                }

            );


            this.auraDots.push(dot);

        this.hpX =

        this.hpY = 185;

        this.hpWidth = 360;

        this.hpHeight = 18;


        this.hpBackground =
            this.add.rectangle(

                this.hpX,

                this.hpY,

                this.hpWidth,

                this.hpHeight,

                0x1f2937

            ).setOrigin(0, 0.5);


        this.hpBar =

                this.hpX,

                this.hpY,

                this.hpWidth *

                this.hpHeight,

                0x60a5fa

            ).setOrigin(0, 0.5);


        this.hpText =
            this.add.text(

                this.gameWidth / 2,

                185,

                "AURA 50%",

                        "Arial",

                    fontStyle:
                        "bold",

                        "#ffffff"

                }

            ).setOrigin(0.5);


        this.egoX =

        this.egoY = 220;


        this.egoBackground =
            this.add.rectangle(

                this.egoX,

                this.egoY,

                this.hpWidth,

                12,

                0x1f2937

            ).setOrigin(0, 0.5);


        this.egoBar =
            this.add.rectangle(

                this.egoX,

                this.egoY,

                0,

                12,

                0xfbbf24

            ).setOrigin(0, 0.5);


        this.egoText =
            this.add.text(

                this.gameWidth / 2,

                220,

                "EGO 0%",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "11px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff"

                }

            ).setOrigin(0.5);


        this.difficultyText =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight - 32,

                "DIFICULDADE 0",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "14px",

                    fontStyle:
                        "bold",

                    color:
                        "#6b7280"

                }

            ).setOrigin(0.5);


        this.egoTimerText =
            this.add.text(

                this.gameWidth / 2,

                this.playAreaBottom - 25,

                "",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:
                        "#fbbf24"

                }

            ).setOrigin(0.5);


        this.feedbackText =
            this.add.text(

                this.gameWidth / 2,

                this.playAreaTop + 95,

                "",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "30px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                        "#090b14",

        this.controlsText =

                    fontStyle:

                    color:

            ).setOrigin(0.5);


        // ----------------------------------------------------

        if (IS_MOBILE) {

            this.controlsText.setText(

    // ========================================================
    // ATUALIZAÇÃO DO HUD
    // ========================================================

    updateHUD(force = false) {


        // ----------------------------------------------------
        // SCORE
        // ----------------------------------------------------

        if (
            force ||
            this._hudScore !== this.score
        ) {

            this.scoreText.setText(
                this.score.toLocaleString("pt-BR")
            );

            this._hudScore =
                this.score;

        }


        // ----------------------------------------------------
        // COMBO
        // ----------------------------------------------------

        if (
            force ||
            this._hudCombo !== this.combo
        ) {

            this.comboText.setText(
                "COMBO " +
                this.combo
            );

            this._hudCombo =
                this.combo;

        }


        // ----------------------------------------------------
        // NÍVEL / AURA
        // ----------------------------------------------------

        const levelData =
            AURA_LEVELS[
                this.auraLevel - 1
            ];


        const auraPercent =
            this.aura /
            GAME_CONFIG.MAX_AURA;


        const auraRounded =
            Math.round(
                auraPercent * 100
            );


        if (
            force ||
            this._hudAura !== auraRounded ||
            this._hudAuraLevel !== this.auraLevel
        ) {

            this.hpBar.width =
                this.hpWidth *
                auraPercent;


            this.hpBar.setFillStyle(
                levelData.color
            );


            this.hpText.setText(
                "AURA " +
                auraRounded +
                "%"
            );


            this.auraDots.forEach(
                (dot, index) => {

                    const active =
                        index <
                        this.auraLevel;


                    const dotData =
                        AURA_LEVELS[index];


                    dot.setFillStyle(

                        dotData.color,

                        active
                            ? 1
                            : 0.12

                    );


                    dot.setStrokeStyle(

                        2,

                        dotData.color,

                        active
                            ? 0.9
                            : 0.25

                    );

                }
            );


            this._hudAura =
                auraRounded;


            this._hudAuraLevel =
                this.auraLevel;

        }


        // ----------------------------------------------------
        // EGO
        // ----------------------------------------------------

        const egoRounded =
            Math.round(this.ego);


        if (
            force ||
            this._hudEgo !== egoRounded ||
            this._hudEgoActive !== this.egoActive
        ) {

            this.egoBar.width =
                this.hpWidth *
                (
                    this.ego /
                    GAME_CONFIG.MAX_EGO
                );


            if (
                this.egoActive
            ) {

                this.egoText.setText(
                    "EGO ATIVO ×" +
                    GAME_CONFIG.EGO_MULTIPLIER
                );

            }

            else {

                this.egoText.setText(
                    "EGO " +
                    egoRounded +
                    "%"
                );

            }


            this._hudEgo =
                egoRounded;


            this._hudEgoActive =
                this.egoActive;

        }


        // ----------------------------------------------------
        // DIFICULDADE
        // ----------------------------------------------------

        if (
            force ||
            this._hudDifficulty !==
            this.difficultyLevel
        ) {

            this.difficultyText.setText(
                "DIFICULDADE " +
                this.difficultyLevel
            );


            this._hudDifficulty =
                this.difficultyLevel;

        }


        // ----------------------------------------------------
        // TIMER EGO
        // ----------------------------------------------------

        if (
            this.egoActive
        ) {

            const timerValue =
                (
                    this.egoRemainingTime /
                    1000
                ).toFixed(1);


            if (
                force ||
                this._hudTimer !== timerValue
            ) {

                this.egoTimerText.setText(

                    "×" +
                    GAME_CONFIG.EGO_MULTIPLIER +
                    "  " +
                    timerValue +
                    "s"

                );


                this._hudTimer =
                    timerValue;

            }

        }

        else if (
            force ||
            this._hudTimer !== ""
        ) {

            this.egoTimerText.setText("");

            this._hudTimer = "";

        }

    }



    // ========================================================
    // DRENAGEM
    // ========================================================

    getCurrentDrain() {


        return (

            GAME_CONFIG.BASE_DRAIN_PER_SECOND *

            Math.pow(

                1 +
                GAME_CONFIG.DRAIN_INCREASE,

                this.difficultyLevel

            )

        );

    }



    // ========================================================
    // START SCREEN
    // ========================================================

        this.startTitle =

                this.gameWidth / 2,

                this.gameHeight * 0.32,

                "FARM AURA",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        IS_MOBILE
                            ? "44px"
                            : "58px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                    stroke:
                        "#090b14",

                    strokeThickness:
                        6

                }

            ).setOrigin(0.5);


        this.startSubtitle =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.43,

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:
                        "#a78bfa"

                }

            ).setOrigin(0.5);


        this.startInstruction =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.51,

                IS_MOBILE
                    ? "TOQUE NOS BOTÕES LATERAIS"
                    : "A / ← + D / → ALTERNADAMENTE",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "17px",

                    color:
                        "#d1d5db",

                    align:
                        "center",

                    wordWrap: {
                        width:
                            this.gameWidth * 0.8
                    }

                }

            ).setOrigin(0.5);


        this.startButton =
            this.add.text(

                this.gameWidth / 2,

                this.gameHeight * 0.62,

                "COMEÇAR",

                {

                    fontFamily:
                        "Arial",

                    fontSize:
                        "22px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff",

                    backgroundColor:
                        "#6366f1",

                    padding: {

                        left: 38,
                        right: 38,

                        top: 16,
                        bottom: 16

                    }

                }

            ).setOrigin(0.5);


        this.startButton.setInteractive({

            useHandCursor:

        });


        this.startButton.on(

            }

            "keydown",

    // ========================================================
    // START GAME
    // ========================================================

    startGame() {


        if (
            this.gameStarted
        ) {

            return;

        }


        this.gameStarted = true;


        this.audio.init();


        if (this.startOverlay) {

            this.startOverlay.destroy();

            this.startOverlay = null;

        }


        if (this.startTitle) {

            this.startTitle.destroy();

            this.startTitle = null;

        }


        if (this.startSubtitle) {

            this.startSubtitle.destroy();

            this.startSubtitle = null;

        }


        if (this.startInstruction) {

            this.startInstruction.destroy();

            this.startInstruction = null;

        }


        if (this.startButton) {

            this.startButton.destroy();

            this.startButton = null;

        }


        this.showFeedback(
            "COMEÇOU!"
        );


        this.updateHUD(true);

    }



    // ========================================================
    // GAME OVER
    // ========================================================

    endGame() {


        if (
            this.gameOver
        ) {

            return;

        }


        this.gameOver = true;


        if (
            this.egoActive
        ) {

            this.endEgo();

        }


        const overlay =
            this.add.rectangle(

                0,
                0,

                this.gameWidth,
                this.gameHeight,

                0x000000,
                0.88

            ).setOrigin(0, 0);


        this.add.text(

            this.gameWidth / 2,

            this.gameHeight * 0.29,

            "GAME OVER",

            {

                fontFamily:
                    "Arial",

                fontSize:
                    IS_MOBILE
                        ? "46px"
                        : "64px",

                fontStyle:
                    "bold",

                color:
                    "#ffffff"

            }

        ).setOrigin(0.5);


        this.add.text(

            this.gameWidth / 2,

            this.gameHeight * 0.42,

            "SCORE  " +
            this.score.toLocaleString("pt-BR"),

            {

                fontFamily:
                    "Arial",

                fontSize:
                    "30px",

                fontStyle:
                    "bold",

                color:
                    "#a78bfa"

            }

        ).setOrigin(0.5);


        this.add.text(

            this.gameWidth / 2,

            this.gameHeight * 0.50,

            "COMBO MÁXIMO  " +
            this.maxCombo,

            {

                fontFamily:
                    "Arial",

                fontSize:
                    "22px",

                fontStyle:
                    "bold",

                color:
                    "#c4b5fd"

            }

        ).setOrigin(0.5);


        this.add.text(

            this.gameWidth / 2,

            this.gameHeight * 0.66,

            IS_MOBILE
                ? "TOQUE NA TELA PARA JOGAR NOVAMENTE"
                : "ENTER = JOGAR NOVAMENTE",

            {

                fontFamily:
                    "Arial",

                fontSize:
                    IS_MOBILE
                        ? "15px"
                        : "18px",

                fontStyle:
                    "bold",

                color:
                    "#ffffff",

                align:
                    "center",

                wordWrap: {
                    width:
                        this.gameWidth * 0.8
                }

            }

        ).setOrigin(0.5);


        if (IS_MOBILE) {

            this.input.once(
                "pointerdown",
                () => {

                    this.scene.restart();

                }
            );

        }

        else {

            this.input.keyboard.once(
                "keydown-ENTER",
                () => {

                    this.scene.restart();

                }
            );

        }

    }



    // ========================================================
    // UPDATE
    // ========================================================

    update(time, delta) {


        if (
            !this.gameStarted ||
            this.gameOver
        ) {

            return;

        }


        // ----------------------------------------------------
        // DIFICULDADE
        // ----------------------------------------------------

        this.difficultyTimer +=
            delta;


        if (
            this.difficultyTimer >=
            GAME_CONFIG.DIFFICULTY_INTERVAL
        ) {

            this.difficultyTimer -=
                GAME_CONFIG.DIFFICULTY_INTERVAL;


            this.difficultyLevel++;


            this.showFeedback(

                "NÍVEL " +
                this.difficultyLevel

            );


            this.updateHUD();

        }


        // ----------------------------------------------------
        // DRENAGEM
        // ----------------------------------------------------

        const drainPerSecond =
            this.getCurrentDrain();


        this.aura -=
            drainPerSecond *
            (
                delta /
                1000
            );


        this.aura =
            Math.max(
                0,
                this.aura
            );


        // ----------------------------------------------------
        // EGO
        // ----------------------------------------------------

        if (
            this.egoActive
        ) {

            this.egoRemainingTime -=
                delta;


            if (
                this.egoRemainingTime <=
                0
            ) {

                this.endEgo();

                this.updateHUD();

            }

        }


        // ----------------------------------------------------
        // HUD
        //
        // Não atualizamos tudo a cada frame.
        //
        // Apenas valores que realmente mudaram.
        // ----------------------------------------------------

        const currentAura =
            Math.round(this.aura);


        const currentTimer =
            this.egoActive
                ? Math.floor(
                    this.egoRemainingTime / 100
                )
                : 0;


        if (
            currentAura !==
            this._lastAuraUpdate ||
            currentTimer !==
            this._lastTimerUpdate
        ) {

            this.updateHUD();


            this._lastAuraUpdate =
                currentAura;


            this._lastTimerUpdate =
                currentTimer;

        }


        // ----------------------------------------------------
        // GAME OVER
        // ----------------------------------------------------

        if (
            this.aura <= 0
        ) {

            this.endGame();

        }

    }

}



// ============================================================
// PHASER CONFIG
// ============================================================

const config = {

    type:

    width:
        window.innerWidth,


    height:
        window.innerHeight,

    scene:
        FarmAuraScene,


    scale: {

        mode:

        autoCenter:
            Phaser.Scale.CENTER_BOTH

    }

};



// ============================================================
// START
// ============================================================

new Phaser.Game(config);


</script>
